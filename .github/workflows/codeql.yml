name: CodeQL

# Scans the engine's C++ sources for security issues. Results show under the repository's
# Security tab. Runs on pushes to main, weekly, and on demand.
on:
  push:
    branches: [main]
    paths:
      - "**.cpp"
      - "**.h"
      - "**.c"
      - ".github/workflows/codeql.yml"
  schedule:
    - cron: "0 5 * * 1"
  workflow_dispatch:

permissions: {}

# A full scan takes about two hours, longer than the gap between pushes to main, so a running
# scan is never cancelled. A new push waits behind it; only the newest waiting run is kept.
concurrency:
  group: codeql
  cancel-in-progress: false

jobs:
  analyze:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    timeout-minutes: 340
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Initialize CodeQL
        uses: github/codeql-action/init@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          languages: c-cpp
          build-mode: none
          config: |
            paths-ignore:
              - thirdparty
              - tests
              - modules/*/thirdparty

      - name: Analyze
        uses: github/codeql-action/analyze@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          category: "/language:c-cpp"
