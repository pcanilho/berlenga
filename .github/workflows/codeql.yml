name: CodeQL

# Scans the engine's C++ sources for security issues. Results show under the repository's
# Security tab. Runs on pushes to main, weekly, and on demand.
on:
  push:
    branches: [main]
    paths:
      - "**.cpp"
      - "**.h"
      - "**.c"
      - ".github/workflows/codeql.yml"
  schedule:
    - cron: "0 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

concurrency:
  group: codeql
  cancel-in-progress: true

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: c-cpp
          build-mode: none
          config: |
            paths-ignore:
              - thirdparty
              - tests
              - modules/*/thirdparty

      - name: Analyze
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:c-cpp"
