name: Release retry

# A release build that never started (GitHub found no runner for it, as happens
# with macOS when hosted capacity is short) is retried instead of left out: the
# release waits as a draft, the failed jobs re-run, and the publish job adds their
# zips and publishes it. Up to three attempts; a build that started and failed is
# a real failure and is left.
on:
  workflow_run:
    workflows: ["Release (editor builds)"]
    types: [completed]

permissions: {}

jobs:
  retry:
    if: github.event.workflow_run.conclusion == 'failure' && github.event.workflow_run.run_attempt < 3
    permissions:
      actions: write
    runs-on: ubuntu-latest
    timeout-minutes: 15 # the five minutes' wait included
    steps:
      - name: Re-run builds that never got a runner
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          ATTEMPT: ${{ github.event.workflow_run.run_attempt }}
        run: |
          # jobs that ended without running a single step
          unstarted=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RUN_ID/attempts/$ATTEMPT/jobs" \
            --jq '[.jobs[] | select((.conclusion == "cancelled" or .conclusion == "failure") and ([.steps[]? | select(.conclusion != null and .conclusion != "skipped")] | length) == 0) | .name] | join(", ")')
          if [ -z "$unstarted" ]; then
            echo "No build was left without a runner; nothing to retry."
            exit 0
          fi
          echo "Retrying: $unstarted"
          sleep 300 # give hosted capacity a few minutes
          gh run rerun "$RUN_ID" --failed --repo "$GITHUB_REPOSITORY"
