name: Release (editor builds)

# Builds the Windows, macOS and Linux editors from main and publishes them as the latest release.
# Another branch or commit can be built on demand; its zips stay workflow artifacts.
# Runs on demand, and every Monday when main has moved since the last release.
on:
  workflow_dispatch:
    inputs:
      ref:
        description: Branch, tag or commit to build
        default: main
        required: true
      force:
        description: Publish even if this commit already has a release
        type: boolean
        default: false
      build_only:
        description: Build and keep the zips as workflow artifacts, publish no release
        type: boolean
        default: false
  schedule:
    - cron: "0 6 * * 1"

# Each job asks only for what it needs.
permissions: {}

concurrency:
  group: release
  cancel-in-progress: false

env:
  PYTHONIOENCODING: utf8

jobs:
  check:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.check.outputs.sha }}
      short: ${{ steps.check.outputs.short }}
      publish: ${{ steps.check.outputs.publish }}
      release: ${{ steps.check.outputs.release }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ inputs.ref || 'main' }}
          fetch-depth: 0

      - name: Decide whether to publish
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
          FORCE: ${{ inputs.force }}
          BUILD_ONLY: ${{ inputs.build_only }}
        run: |
          sha=$(git rev-parse HEAD)
          short=${sha:0:8}
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "short=$short" >> "$GITHUB_OUTPUT"
          latest=$(gh release view --repo "$GITHUB_REPOSITORY" --json tagName -q .tagName 2>/dev/null || true)
          latest_sha=""
          if [ -n "$latest" ]; then
            latest_sha=$(git rev-list -n 1 "$latest" 2>/dev/null || true)
          fi
          if [ "$BUILD_ONLY" = "true" ]; then
            echo "Build only: no release."
            echo "publish=true" >> "$GITHUB_OUTPUT"
            echo "release=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # Only main is released: a build of any other branch would become the latest
          # release and move main's changelog. Off main, build the zips and stop.
          on_main=$(gh api "repos/$GITHUB_REPOSITORY/compare/main...$sha" --jq '.status == "identical" or .status == "behind"')
          if [ "$on_main" != "true" ]; then
            echo "::notice::$short is not on main: build only, no release."
            echo "publish=true" >> "$GITHUB_OUTPUT"
            echo "release=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "release=true" >> "$GITHUB_OUTPUT"
          if [ "$latest_sha" = "$sha" ] && [ "$FORCE" != "true" ]; then
            echo "Latest release $latest already points at $short."
            echo "publish=false" >> "$GITHUB_OUTPUT"
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi

  windows:
    permissions:
      contents: read
    needs: check
    if: needs.check.outputs.publish == 'true'
    runs-on: windows-latest
    timeout-minutes: 340
    env:
      SCONS_CACHE: ${{ github.workspace }}/.scons_cache/
      SHORT: ${{ needs.check.outputs.short }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ needs.check.outputs.sha }}

      - name: Restore build cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.SCONS_CACHE }}
          key: release-windows-editor|${{ needs.check.outputs.sha }}
          restore-keys: release-windows-editor|

      - name: Setup Python and SCons
        uses: ./.github/actions/godot-deps

      - name: Build
        shell: bash
        run: scons platform=windows target=editor optimize=speed lto=none debug_symbols=no accesskit=no d3d12=no cache_path="$SCONS_CACHE" cache_limit=7

      - name: Save build cache
        if: always()
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.SCONS_CACHE }}
          key: release-windows-editor|${{ needs.check.outputs.sha }}
        continue-on-error: true

      - name: Package
        shell: pwsh
        run: |
          $short = $env:SHORT
          New-Item -ItemType Directory -Force pkg | Out-Null
          Copy-Item bin/godot.windows.editor.x86_64.exe, bin/godot.windows.editor.x86_64.console.exe, LICENSE.txt, COPYRIGHT.txt pkg/
          Compress-Archive -Path pkg/* -DestinationPath "godot-fork-windows-$short.zip"
          $editor = (Get-FileHash bin/godot.windows.editor.x86_64.exe -Algorithm SHA256).Hash
          $console = (Get-FileHash bin/godot.windows.editor.x86_64.console.exe -Algorithm SHA256).Hash
          "- godot.windows.editor.x86_64.exe: $editor`n- godot.windows.editor.x86_64.console.exe: $console" | Set-Content hashes-windows.md

      - name: Upload
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows
          path: |
            godot-fork-windows-*.zip
            hashes-windows.md

  macos:
    permissions:
      contents: read
    needs: check
    if: needs.check.outputs.publish == 'true'
    runs-on: macos-26
    timeout-minutes: 340
    env:
      SCONS_CACHE: ${{ github.workspace }}/.scons_cache/
      SHORT: ${{ needs.check.outputs.short }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ needs.check.outputs.sha }}

      - name: Restore build cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.SCONS_CACHE }}
          key: release-macos-editor|${{ needs.check.outputs.sha }}
          restore-keys: release-macos-editor|

      - name: Setup Python and SCons
        uses: ./.github/actions/godot-deps

      - name: Setup Vulkan SDK
        run: sh misc/scripts/install_vulkan_sdk_macos.sh

      - name: Build (x86_64)
        run: scons platform=macos arch=x86_64 target=editor optimize=speed lto=none debug_symbols=no accesskit=no cache_path="$SCONS_CACHE" cache_limit=7

      - name: Build (arm64)
        run: scons platform=macos arch=arm64 target=editor optimize=speed lto=none debug_symbols=no accesskit=no cache_path="$SCONS_CACHE" cache_limit=7

      - name: Save build cache
        if: always()
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.SCONS_CACHE }}
          key: release-macos-editor|${{ needs.check.outputs.sha }}
        continue-on-error: true

      - name: Package
        run: |
          short=$SHORT
          lipo -create bin/godot.macos.editor.x86_64 bin/godot.macos.editor.arm64 -output bin/godot.macos.editor.universal
          cp -R misc/dist/macos_tools.app Godot.app
          mkdir -p Godot.app/Contents/MacOS
          cp bin/godot.macos.editor.universal Godot.app/Contents/MacOS/Godot
          chmod +x Godot.app/Contents/MacOS/Godot
          codesign --force --deep --sign - Godot.app
          mkdir pkg
          mv Godot.app pkg/
          cp LICENSE.txt COPYRIGHT.txt pkg/
          ditto -c -k pkg "godot-fork-macos-universal-$short.zip"
          echo "- Godot.app/Contents/MacOS/Godot (universal): $(shasum -a 256 bin/godot.macos.editor.universal | cut -d' ' -f1)" > hashes-macos.md

      - name: Upload
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: macos
          path: |
            godot-fork-macos-universal-*.zip
            hashes-macos.md

  linux:
    permissions:
      contents: read
    needs: check
    if: needs.check.outputs.publish == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-22.04
          - arch: arm64
            runner: ubuntu-22.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 340
    env:
      SCONS_CACHE: ${{ github.workspace }}/.scons_cache/
      SHORT: ${{ needs.check.outputs.short }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ needs.check.outputs.sha }}

      - name: Restore build cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.SCONS_CACHE }}
          key: release-linux-${{ matrix.arch }}-editor|${{ needs.check.outputs.sha }}
          restore-keys: release-linux-${{ matrix.arch }}-editor|

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config libx11-dev libxcursor-dev libxinerama-dev libgl1-mesa-dev libglu1-mesa-dev libasound2-dev libpulse-dev libudev-dev libxi-dev libxrandr-dev libwayland-dev wayland-protocols libwayland-bin

      - name: Setup Python and SCons
        uses: ./.github/actions/godot-deps

      - name: Build
        run: scons platform=linuxbsd arch=${{ matrix.arch }} target=editor optimize=speed lto=none debug_symbols=no accesskit=no cache_path="$SCONS_CACHE" cache_limit=7

      - name: Save build cache
        if: always()
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.SCONS_CACHE }}
          key: release-linux-${{ matrix.arch }}-editor|${{ needs.check.outputs.sha }}
        continue-on-error: true

      - name: Package
        run: |
          short=$SHORT
          bin=godot.linuxbsd.editor.${{ matrix.arch }}
          strip bin/$bin
          mkdir pkg
          cp bin/$bin LICENSE.txt COPYRIGHT.txt pkg/
          chmod +x pkg/$bin
          (cd pkg && zip -9 -r "../godot-fork-linux-${{ matrix.arch }}-$short.zip" .)
          echo "- $bin: $(sha256sum bin/$bin | cut -d' ' -f1)" > hashes-linux-${{ matrix.arch }}.md

      - name: Upload
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: linux-${{ matrix.arch }}
          path: |
            godot-fork-linux-*.zip
            hashes-linux-*.md

  publish:
    permissions:
      actions: read
      contents: write
    needs: [check, windows, macos, linux]
    # Windows is required; a failed macOS or Linux build only leaves that zip out.
    if: always() && needs.check.outputs.publish == 'true' && needs.check.outputs.release == 'true' && needs.windows.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: main
          fetch-depth: 0

      - name: Download builds
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
          merge-multiple: true

      - name: Publish
        id: publish
        env:
          GH_TOKEN: ${{ github.token }}
          SHORT: ${{ needs.check.outputs.short }}
          SHA: ${{ needs.check.outputs.sha }}
          ATTEMPT: ${{ github.run_attempt }}
        run: |
          short=$SHORT
          tag="build-$short"
          # the changelog as built: its Unreleased entries are this release's notes
          git show "$SHA:CHANGELOG.md" > released-changelog.md 2>/dev/null || printf '# Changelog\n\n## Unreleased\n' > released-changelog.md
          # and the entry files it was built with
          mkdir -p released
          if git ls-tree -d "$SHA" changelog.d | grep -q .; then
            git archive "$SHA" changelog.d | tar -x -C released
          fi
          python3 .github/scripts/changelog.py notes released-changelog.md released/changelog.d > changes.md
          python3 .github/scripts/release_notes.py changes.md dist "$short" "$GITHUB_REPOSITORY" > notes.md

          # Builds that never got a runner (macOS when GitHub's hosted capacity is short):
          # release-retry.yml re-runs them, so while attempts remain the release waits as a
          # draft. Published releases are immutable, so a zip can't be added afterwards.
          unstarted=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/attempts/$ATTEMPT/jobs" \
            --jq '[.jobs[] | select((.conclusion == "cancelled" or .conclusion == "failure") and ([.steps[]? | select(.conclusion != null and .conclusion != "skipped")] | length) == 0) | .name] | join(", ")')
          state=$(gh api "repos/$GITHUB_REPOSITORY/releases?per_page=30" --jq ".[] | select(.tag_name == \"$tag\") | if .draft then \"draft\" else \"published\" end" | head -1)

          if [ "$state" = published ]; then
            echo "$tag is already published (immutable); nothing to add."
            exit 0
          fi
          if [ -z "$state" ]; then
            gh release create "$tag" dist/*.zip --repo "$GITHUB_REPOSITORY" --target "$SHA" \
              --title "build $short (editor)" --notes-file notes.md --generate-notes --draft
          else
            gh release upload "$tag" dist/*.zip --repo "$GITHUB_REPOSITORY" --clobber
            gh api "repos/$GITHUB_REPOSITORY/releases/generate-notes" -f tag_name="$tag" -f target_commitish="$SHA" --jq .body > generated.md
            { echo; cat generated.md; } >> notes.md
            gh release edit "$tag" --repo "$GITHUB_REPOSITORY" --notes-file notes.md
          fi
          if [ -n "$unstarted" ] && [ "$ATTEMPT" -lt 3 ]; then
            echo "Waiting for a retry of: $unstarted. $tag stays a draft."
            exit 0
          fi
          [ -n "$unstarted" ] && echo "Publishing without: $unstarted (no runner after $ATTEMPT attempts)."
          gh release edit "$tag" --repo "$GITHUB_REPOSITORY" --draft=false --latest
          echo "published=true" >> "$GITHUB_OUTPUT"

      - name: Move the released entries in CHANGELOG.md
        if: steps.publish.outputs.published == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          SHORT: ${{ needs.check.outputs.short }}
        run: |
          # Main may move while this runs (a merge, another release): retry on the new main.
          remote="https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          for attempt in 1 2 3 4 5; do
            python3 .github/scripts/changelog.py move released-changelog.md "build-$SHORT" "$(date -u +%F)" released/changelog.d
            git add -A -- CHANGELOG.md changelog.d
            if git diff --cached --quiet; then
              exit 0
            fi
            git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
              commit -q -m "Changelog: build-$SHORT"
            if git push "$remote" HEAD:main; then
              exit 0
            fi
            sleep $((attempt * 5))
            git fetch -q "$remote" main
            git reset -q --hard FETCH_HEAD
          done
          echo "::error::Could not push the changelog move to main."
          exit 1
